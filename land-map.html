<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Parcels – Mzilikazi Kingdom</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0a0f0d;
  --green:#1f3c2f;
  --gold:#c9a84c;
  --gold-soft:rgba(201,168,76,0.15);
  --border:rgba(201,168,76,0.2);
  --text:#fff;
  --muted:rgba(255,255,255,0.45);
  --available:#22c55e;
  --reserved:#f59e0b;
  --development:#3b82f6;
  --claimed:#a855f7;
}
body{background:var(--ink);font-family:'Syne',sans-serif;overflow-x:hidden;padding-bottom:70px;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;position:sticky;top:0;z-index:3000;}
.topbar img{height:38px;}
.topbar h2{font-size:15px;color:var(--green);font-weight:700;}

/* HEADER */
.header{
  background:linear-gradient(135deg,#0d2018 0%,#1a3828 50%,#0d2018 100%);
  padding:20px 18px 16px;border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
.header::before{
  content:'LAND';position:absolute;right:-10px;top:-10px;
  font-size:80px;font-weight:800;color:rgba(201,168,76,0.06);
  letter-spacing:-4px;pointer-events:none;line-height:1;
}
.header h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.5px;margin-bottom:2px;}
.header p{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}

/* SEARCH BAR */
.search-bar{
  padding:10px 14px;background:#0f1a13;border-bottom:1px solid var(--border);
  display:flex;gap:8px;align-items:center;
}
.search-bar input{
  flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;color:#fff;font-size:12px;
  font-family:'Syne',sans-serif;outline:none;
}
.search-bar input::placeholder{color:var(--muted);}
.search-bar input:focus{border-color:rgba(201,168,76,0.5);}
.filter-btn{
  padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:rgba(0,0,0,0.3);color:var(--muted);font-size:12px;
  cursor:pointer;font-family:'Syne',sans-serif;white-space:nowrap;
}
.filter-btn.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);}

/* STATUS FILTERS */
.status-bar{
  display:flex;gap:6px;padding:10px 14px;overflow-x:auto;
  background:#0f1a13;border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.status-bar::-webkit-scrollbar{display:none;}
.status-pill{
  padding:5px 12px;border-radius:20px;border:1px solid;
  font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:'DM Mono',monospace;transition:all 0.2s;
  background:transparent;
}
.sp-all{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.5);}
.sp-all.on{background:rgba(255,255,255,0.1);color:#fff;}
.sp-available{border-color:var(--available);color:var(--available);}
.sp-available.on{background:rgba(34,197,94,0.15);}
.sp-reserved{border-color:var(--reserved);color:var(--reserved);}
.sp-reserved.on{background:rgba(245,158,11,0.15);}
.sp-development{border-color:var(--development);color:var(--development);}
.sp-development.on{background:rgba(59,130,246,0.15);}
.sp-claimed{border-color:var(--claimed);color:var(--claimed);}
.sp-claimed.on{background:rgba(168,85,247,0.15);}

/* MAP */
.map-wrapper{position:relative;}
#landMap{width:100%;height:280px;background:#0f1a13;}

/* VIEW TOGGLE */
.view-toggle{
  position:absolute;bottom:10px;left:10px;z-index:1000;
  display:flex;border-radius:8px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.12);
}
.vt-btn{
  padding:7px 13px;font-size:11px;font-weight:600;cursor:pointer;
  border:none;font-family:'Syne',sans-serif;transition:all 0.2s;
  background:rgba(10,15,13,0.95);color:rgba(255,255,255,0.5);
}
.vt-btn:not(:last-child){border-right:1px solid rgba(255,255,255,0.1);}
.vt-btn.active{background:#fff;color:#1f3c2f;}

/* PARCELS LIST */
.list-header{
  padding:12px 14px 6px;
  display:flex;justify-content:space-between;align-items:center;
}
.list-header h3{font-size:13px;font-weight:700;color:#fff;}
.list-header span{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}

.parcel-card{
  margin:0 14px 10px;border-radius:14px;overflow:hidden;
  border:1px solid var(--border);background:rgba(15,26,19,0.5);
  cursor:pointer;transition:border-color 0.2s,transform 0.15s;
}
.parcel-card:active{transform:scale(0.98);}
.parcel-card.highlighted{border-color:var(--gold);}

.parcel-top{padding:13px 14px 10px;display:flex;gap:10px;align-items:flex-start;}
.parcel-ref{
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--gold);background:var(--gold-soft);
  border:1px solid var(--border);border-radius:6px;
  padding:3px 8px;white-space:nowrap;flex-shrink:0;margin-top:2px;
}
.parcel-info{flex:1;}
.parcel-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;}
.parcel-loc{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}

.status-badge{
  font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;
  border:1px solid;white-space:nowrap;flex-shrink:0;font-family:'DM Mono',monospace;
}
.badge-available{border-color:var(--available);color:var(--available);background:rgba(34,197,94,0.1);}
.badge-reserved{border-color:var(--reserved);color:var(--reserved);background:rgba(245,158,11,0.1);}
.badge-development{border-color:var(--development);color:var(--development);background:rgba(59,130,246,0.1);}
.badge-claimed{border-color:var(--claimed);color:var(--claimed);background:rgba(168,85,247,0.1);}

.parcel-stats{
  display:flex;border-top:1px solid var(--border);
}
.p-stat{
  flex:1;padding:9px 8px;text-align:center;
  border-right:1px solid var(--border);
}
.p-stat:last-child{border-right:none;}
.p-stat .v{font-size:13px;font-weight:700;color:var(--gold);}
.p-stat .l{font-size:9px;color:var(--muted);margin-top:1px;font-family:'DM Mono',monospace;text-transform:uppercase;}

.parcel-actions{
  display:flex;gap:8px;padding:10px 14px;
  border-top:1px solid var(--border);
}
.p-action{
  flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:rgba(255,255,255,0.6);font-size:11px;
  font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;
  text-align:center;transition:all 0.2s;
}
.p-action.primary{
  background:var(--gold-soft);color:var(--gold);border-color:var(--gold);
}
.p-action:active{opacity:0.7;}

/* DETAIL DRAWER */
#drawer{
  position:fixed;bottom:70px;left:0;right:0;z-index:4000;
  background:#0f1a13;border-top:1px solid var(--border);
  transform:translateY(100%);transition:transform 0.3s ease;
  max-height:70vh;overflow-y:auto;border-radius:18px 18px 0 0;
}
#drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:12px auto 0;}
.drawer-inner{padding:16px 18px 24px;}
.drawer-tag{font-size:10px;font-family:'DM Mono',monospace;color:var(--gold);margin-bottom:6px;}
.drawer-title{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.3px;}
.drawer-sub{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:14px;}
.drawer-desc{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.7;margin-bottom:14px;}
.drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.d-cell{
  background:rgba(0,0,0,0.3);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;
}
.d-cell .dl{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:3px;}
.d-cell .dv{font-size:13px;font-weight:700;color:#fff;}
.drawer-close{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:rgba(255,255,255,0.5);font-size:13px;
  font-family:'Syne',sans-serif;cursor:pointer;margin-top:4px;font-weight:600;
}

/* NAV */
.nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;z-index:2000;}
.nav div{flex:1;text-align:center;padding:14px;font-size:13px;color:#6b7280;cursor:pointer;font-family:'Syne',sans-serif;}
.nav div.active{color:var(--green);font-weight:700;}
</style>
</head>
<body>

<div class="topbar">
  <img src="logo.png" alt="Mzilikazi Kingdom">
  <h2>Mzilikazi Kingdom</h2>
</div>

<div class="header">
  <h1>Land Intelligence</h1>
  <p>PARCEL REGISTRY · SEKHUKHUNE DISTRICT · LIMPOPO</p>
</div>

<!-- SEARCH -->
<div class="search-bar">
  <input id="searchInput" placeholder="&#x1F50D;&#xFE0E; Search parcel name or reference..." oninput="filterParcels()">
</div>

<!-- STATUS FILTERS -->
<div class="status-bar">
  <button class="status-pill sp-all on" onclick="setFilter('all',this)">All</button>
  <button class="status-pill sp-available" onclick="setFilter('available',this)">Available</button>
  <button class="status-pill sp-reserved" onclick="setFilter('reserved',this)">Reserved</button>
  <button class="status-pill sp-development" onclick="setFilter('development',this)">In Development</button>
  <button class="status-pill sp-claimed" onclick="setFilter('claimed',this)">Land Claim</button>
</div>

<!-- MAP -->
<div class="map-wrapper">
  <div id="landMap"></div>
  <div class="view-toggle">
    <button class="vt-btn active" id="btnMap" onclick="setMapView('map')">Map</button>
    <button class="vt-btn" id="btnSat" onclick="setMapView('satellite')">Satellite</button>
  </div>
</div>

<!-- PARCEL LIST -->
<div class="list-header">
  <h3>Registered Parcels</h3>
  <span id="countLabel">5 parcels</span>
</div>
<div id="parcelList"></div>

<!-- DETAIL DRAWER -->
<div id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-inner" id="drawerContent"></div>
</div>

<!-- NAV -->
<div class="nav">
  <div onclick="location.href='index.html'">Home</div>
  <div onclick="location.href='index.html'">Submit</div>
  <div onclick="location.href='index.html'">Citizen</div>
  <div onclick="location.href='index.html'">Invest</div>
  <div class="active" onclick="location.href='gis-portal.html'">GIS</div>
</div>

<script>
/* ── PARCEL DATA ── */
const parcels = [
  {
    id:'MZL-LP-001',
    name:'Blue Ridge Surface Rights',
    location:'Groblersdal, Greater Sekhukhune',
    province:'Limpopo',
    status:'development',
    size:'6 500',
    zoning:'Mining & Industrial',
    deed:'T048517/2008',
    owner:'Blue Ridge Platinum Pty Ltd',
    coords:[[-25.22,29.53],[-25.22,29.59],[-25.27,29.59],[-25.27,29.53]],
    center:[-25.245,29.56],
    description:'Surface rights held under Title Deed T048517/2008. Mineralised area inclusive of UG2 reef. Mining Right MR-LP177 MRC (30 years from 29 May 2014). Surrounding farms zoned as agricultural grazing farmland.',
    water:'Boreholes + Loskop Dam via canal',
    power:'Eskom — 2×20MVA at Mapog substation',
    eia:'Approved & executed'
  },
  {
    id:'MZL-LP-002',
    name:'Sekhukhune Agricultural Corridor',
    location:'Jane Furse, Sekhukhune District',
    province:'Limpopo',
    status:'available',
    size:'3 200',
    zoning:'Agricultural',
    deed:'Pending registration',
    owner:'Mzilikazi Kingdom',
    coords:[[-24.95,29.85],[-24.95,30.1],[-25.15,30.1],[-25.15,29.85]],
    center:[-25.05,29.975],
    description:'Prime dryland and irrigation agricultural parcel. Suitable for maize, sorghum and citrus. River access for irrigation. Ideal for partnership with established agri-processors.',
    water:'Seasonal river + borehole',
    power:'Eskom grid — 5km connection',
    eia:'Required — pre-application complete'
  },
  {
    id:'MZL-LP-003',
    name:'Groblersdal Logistics Node',
    location:'Groblersdal, Limpopo',
    province:'Limpopo',
    status:'reserved',
    size:'850',
    zoning:'Logistics & Industrial',
    deed:'T102334/2019',
    owner:'Mzilikazi Kingdom Holdings',
    coords:[[-25.16,29.36],[-25.16,29.46],[-25.23,29.46],[-25.23,29.36]],
    center:[-25.195,29.41],
    description:'Strategic logistics node adjacent to the N11 corridor. Ideal for warehousing, cold storage and agri-processing. 850ha zoned industrial. Environmental clearance obtained.',
    water:'Municipal supply + 2 boreholes',
    power:'Eskom — direct connection',
    eia:'Clearance obtained'
  },
  {
    id:'MZL-LP-004',
    name:'Tubatse Eco-Tourism Reserve',
    location:'Burgersfort, Tubatse',
    province:'Limpopo',
    status:'development',
    size:'2 100',
    zoning:'Conservation & Tourism',
    deed:'T087621/2016',
    owner:'Mzilikazi Kingdom Trust',
    coords:[[-24.65,30.25],[-24.65,30.45],[-24.82,30.45],[-24.82,30.25]],
    center:[-24.735,30.35],
    description:'Pristine bushveld eco-tourism and conservation overlay in the Tubatse area. Game reintroduction programme underway. Lodge development rights approved. Adjacent to Kruger Park wildlife corridor.',
    water:'Natural springs + boreholes',
    power:'Off-grid solar — design phase',
    eia:'Approved for conservation use'
  },
  {
    id:'MZL-LP-005',
    name:'Bakgaga Community Land Claim',
    location:'Blue Ridge, Sekhukhune',
    province:'Limpopo',
    status:'claimed',
    size:'1 800',
    zoning:'Community / Mixed Use',
    deed:'Land Claim Ref: LCC-LP-2204',
    owner:'Bakgagabakopa Community (Traditional Council)',
    coords:[[-25.28,29.55],[-25.28,29.68],[-25.38,29.68],[-25.38,29.55]],
    center:[-25.33,29.615],
    description:'Active community land claim under DALRRD. Good relations maintained with Bakgagabakopa Community and Traditional Council representative Ghoshi Rammupudu Boleu Harry. Community holds shareholding and economic benefit agreement with Blue Ridge Platinum.',
    water:'Municipal + borehole programme',
    power:'Eskom grid',
    eia:'Community consultation complete'
  }
];

/* ── STATUS CONFIG ── */
const statusConfig = {
  available:  {label:'Available',    cls:'badge-available', color:'#22c55e'},
  reserved:   {label:'Reserved',     cls:'badge-reserved',  color:'#f59e0b'},
  development:{label:'In Dev',       cls:'badge-development',color:'#3b82f6'},
  claimed:    {label:'Land Claim',   cls:'badge-claimed',   color:'#a855f7'}
};

/* ── MAP ── */
const lmap = L.map('landMap',{center:[-25.1,29.7],zoom:9,zoomControl:false});
const darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &amp; CARTO',subdomains:'abcd',maxZoom:19
});
const satTile = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {attribution:'Tiles &copy; Esri',maxZoom:19}
);
darkTile.addTo(lmap);

function setMapView(mode){
  document.getElementById('btnMap').classList.toggle('active', mode==='map');
  document.getElementById('btnSat').classList.toggle('active', mode==='satellite');
  if(mode==='satellite'){ lmap.removeLayer(darkTile); satTile.addTo(lmap); }
  else { lmap.removeLayer(satTile); darkTile.addTo(lmap); }
}

// Add tooltip style
const s = document.createElement('style');
s.textContent=`.leaflet-tooltip{background:rgba(10,15,13,0.92)!important;border:1px solid rgba(201,168,76,0.3)!important;color:#fff!important;border-radius:8px!important;padding:6px 10px!important;font-family:'Syne',sans-serif!important;font-size:11px!important;}.leaflet-tooltip::before{display:none!important;}`;
document.head.appendChild(s);

/* ── DRAW PARCELS ON MAP ── */
const polyMap = {};
parcels.forEach(p=>{
  const c = statusConfig[p.status].color;
  const poly = L.polygon(p.coords,{
    color:c, fillColor:c, fillOpacity:0.25, weight:2
  });
  poly.on('click',()=> openDrawer(p));
  poly.on('mouseover',function(){this.setStyle({fillOpacity:0.45,weight:3});});
  poly.on('mouseout', function(){this.setStyle({fillOpacity:0.25,weight:2});});
  poly.bindTooltip(`<strong>${p.name}</strong><br><span style="opacity:0.6">${p.id}</span>`,{sticky:true});
  poly.addTo(lmap);
  polyMap[p.id] = poly;
});

/* ── RENDER CARDS ── */
let activeFilter = 'all';

function renderCards(list){
  const container = document.getElementById('parcelList');
  document.getElementById('countLabel').textContent = `${list.length} parcel${list.length!==1?'s':''}`;
  container.innerHTML = list.map(p=>{
    const sc = statusConfig[p.status];
    return `
    <div class="parcel-card" id="card-${p.id}" onclick="openDrawer(parcels.find(x=>x.id==='${p.id}'))">
      <div class="parcel-top">
        <div class="parcel-ref">${p.id}</div>
        <div class="parcel-info">
          <div class="parcel-name">${p.name}</div>
          <div class="parcel-loc">&#x1F4CD;&#xFE0E; ${p.location}</div>
        </div>
        <span class="status-badge ${sc.cls}">${sc.label}</span>
      </div>
      <div class="parcel-stats">
        <div class="p-stat"><div class="v">${p.size}</div><div class="l">Hectares</div></div>
        <div class="p-stat"><div class="v">${p.zoning.split('&')[0].trim()}</div><div class="l">Zoning</div></div>
        <div class="p-stat"><div class="v">${p.province}</div><div class="l">Province</div></div>
      </div>
      <div class="parcel-actions">
        <button class="p-action" onclick="event.stopPropagation();flyTo('${p.id}')">&#x1F5FA;&#xFE0E; View on Map</button>
        <button class="p-action primary" onclick="event.stopPropagation();openDrawer(parcels.find(x=>x.id==='${p.id}'))">Details</button>
      </div>
    </div>`;
  }).join('');
}

function filterParcels(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = activeFilter==='all' ? parcels : parcels.filter(p=>p.status===activeFilter);
  if(q) list = list.filter(p=> p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || p.location.toLowerCase().includes(q));
  renderCards(list);
}

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.status-pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  filterParcels();
}

function flyTo(id){
  const p = parcels.find(x=>x.id===id);
  if(p){ lmap.flyTo(p.center,13,{duration:1}); }
}

/* ── DRAWER ── */
function openDrawer(p){
  if(!p) return;
  const sc = statusConfig[p.status];
  document.getElementById('drawerContent').innerHTML = `
    <div class="drawer-tag">${p.id} · ${sc.label.toUpperCase()}</div>
    <div class="drawer-title">${p.name}</div>
    <div class="drawer-sub">&#x1F4CD;&#xFE0E; ${p.location}, ${p.province}</div>
    <div class="drawer-desc">${p.description}</div>
    <div class="drawer-grid">
      <div class="d-cell"><div class="dl">SIZE</div><div class="dv">${p.size} ha</div></div>
      <div class="d-cell"><div class="dl">ZONING</div><div class="dv">${p.zoning}</div></div>
      <div class="d-cell"><div class="dl">TITLE DEED</div><div class="dv" style="font-size:11px">${p.deed}</div></div>
      <div class="d-cell"><div class="dl">OWNER</div><div class="dv" style="font-size:10px">${p.owner}</div></div>
      <div class="d-cell"><div class="dl">WATER</div><div class="dv" style="font-size:10px">${p.water}</div></div>
      <div class="d-cell"><div class="dl">POWER</div><div class="dv" style="font-size:10px">${p.power}</div></div>
    </div>
    <div class="d-cell" style="margin-bottom:10px"><div class="dl">EIA STATUS</div><div class="dv" style="font-size:12px">${p.eia}</div></div>
    <button class="p-action primary" style="width:100%;padding:11px;border-radius:10px;font-size:13px;margin-bottom:8px;" onclick="flyTo('${p.id}');closeDrawer()">&#x1F5FA;&#xFE0E; View on Map</button>
    <button class="drawer-close" onclick="closeDrawer()">Close</button>
  `;
  document.getElementById('drawer').classList.add('open');
  lmap.flyTo(p.center, 12, {duration:1});
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
}

// close on backdrop tap
document.getElementById('drawer').addEventListener('click', e=>{
  if(e.target === document.getElementById('drawer')) closeDrawer();
});

/* ── INIT ── */
renderCards(parcels);
</script>
</body>
</html>
