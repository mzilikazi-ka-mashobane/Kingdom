<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Map Portal – Mzilikazi Kingdom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

:root{
  --green:#1f3c2f;
  --green-light:#2d5440;
  --gold:#c9a84c;
  --mining:#f59e0b;
  --agri:#22c55e;
  --land:#3b82f6;
  --smart:#a855f7;
  --glass:rgba(0,0,0,0.45);
  --glass-border:rgba(255,255,255,0.10);
}

body{background:#0a0f0d;overflow-x:hidden;padding-bottom:70px;}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:white;position:sticky;top:0;z-index:3000;
}
.topbar img{height:38px;}
.topbar h2{font-size:15px;color:var(--green);font-weight:600;}

/* PAGE HEADER */
.page-header{
  background:linear-gradient(135deg,var(--green) 0%,#0d1f17 100%);
  padding:18px;
  border-bottom:1px solid rgba(201,168,76,0.3);
}
.page-header h1{
  color:#fff;font-size:18px;font-weight:600;margin-bottom:4px;
}
.page-header p{color:rgba(255,255,255,0.6);font-size:12px;}

/* LAYER CONTROLS */
.layer-bar{
  display:flex;gap:8px;padding:12px;overflow-x:auto;background:#0f1a13;
  border-bottom:1px solid var(--glass-border);
  scrollbar-width:none;
}
.layer-bar::-webkit-scrollbar{display:none;}

.layer-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:20px;border:1px solid;
  font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all 0.2s;
  background:rgba(0,0,0,0.4);
}
.layer-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.layer-btn.mining{border-color:var(--mining);color:var(--mining);}
.layer-btn.mining.on{background:var(--mining);color:#000;}
.layer-btn.mining .dot{background:var(--mining);}

.layer-btn.agri{border-color:var(--agri);color:var(--agri);}
.layer-btn.agri.on{background:var(--agri);color:#000;}
.layer-btn.agri .dot{background:var(--agri);}

.layer-btn.land{border-color:var(--land);color:var(--land);}
.layer-btn.land.on{background:var(--land);color:#fff;}
.layer-btn.land .dot{background:var(--land);}

.layer-btn.smart{border-color:var(--smart);color:var(--smart);}
.layer-btn.smart.on{background:var(--smart);color:#fff;}
.layer-btn.smart .dot{background:var(--smart);}

/* MAP CONTAINER */
#map{
  width:100%;height:calc(100vh - 310px);min-height:320px;
  background:#0f1a13;
}

/* INFO PANEL */
.info-panel{
  background:var(--glass);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);
  padding:14px;
  min-height:80px;
  display:none;
}
.info-panel.visible{display:block;}
.info-panel .zone-tag{
  display:inline-block;padding:3px 10px;border-radius:12px;
  font-size:11px;font-weight:600;margin-bottom:8px;
}
.info-panel h3{color:#fff;font-size:14px;margin-bottom:4px;}
.info-panel p{color:rgba(255,255,255,0.65);font-size:12px;line-height:1.6;}
.info-panel .meta{
  display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;
}
.info-panel .meta span{
  font-size:11px;color:rgba(255,255,255,0.5);
}
.info-panel .meta strong{color:rgba(255,255,255,0.9);}

/* STATS ROW */
.stats-row{
  display:flex;background:#0f1a13;border-top:1px solid var(--glass-border);
}
.stat-box{
  flex:1;padding:12px 8px;text-align:center;
  border-right:1px solid var(--glass-border);
}
.stat-box:last-child{border-right:none;}
.stat-box .val{font-size:18px;font-weight:600;color:var(--gold);}
.stat-box .lbl{font-size:10px;color:rgba(255,255,255,0.45);margin-top:2px;}

/* IDLE HINT */
.map-hint{
  padding:14px;background:#0f1a13;
  border-top:1px solid var(--glass-border);
  text-align:center;
}
.map-hint p{color:rgba(255,255,255,0.35);font-size:12px;}

/* FIELD PINS BUTTON ON STATE */
#fieldPinsBtn.on{background:rgba(201,168,76,0.25)!important;border-color:#c9a84c!important;}
#fieldPinsBtn:not(.on){background:rgba(0,0,0,0.4)!important;color:rgba(201,168,76,0.45)!important;border-color:rgba(201,168,76,0.3)!important;}
#fieldPinsBtn:not(.on) .dot{background:rgba(201,168,76,0.35)!important;}

/* LOADING */
.layer-btn.loading{opacity:0.6;pointer-events:none;}
.layer-btn.loading .dot{
  border:2px solid currentColor;border-top-color:transparent;
  background:transparent;border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* LIVE BADGE */
.live-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);
  border-radius:20px;padding:3px 10px;font-size:10px;color:#4ade80;
  margin-top:5px;
}
.live-badge::before{
  content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3;}}

/* OSM COUNTER */
.osm-count{
  font-size:10px;color:rgba(255,255,255,0.3);
  margin-left:4px;font-weight:400;
}

/* NAV */
.nav{
  position:fixed;bottom:0;width:100%;display:flex;
  background:white;border-top:1px solid #ddd;z-index:2000;
}
.nav div{
  flex:1;text-align:center;padding:14px;font-size:13px;
  color:#6b7280;cursor:pointer;
}
.nav div.active{color:var(--green);font-weight:600;}

/* LEAFLET OVERRIDES */
.leaflet-popup-content-wrapper{
  background:rgba(15,26,19,0.95)!important;
  border:1px solid var(--glass-border)!important;
  border-radius:12px!important;
  color:#fff!important;
  box-shadow:0 8px 32px rgba(0,0,0,0.6)!important;
}
.leaflet-popup-tip{background:rgba(15,26,19,0.95)!important;}
.leaflet-popup-content{color:#fff!important;font-family:Inter,sans-serif!important;}
.leaflet-control-zoom a{
  background:rgba(15,26,19,0.9)!important;
  color:#fff!important;border-color:rgba(255,255,255,0.15)!important;
}
.leaflet-control-attribution{
  background:rgba(0,0,0,0.6)!important;color:rgba(255,255,255,0.4)!important;
  font-size:9px!important;
}
/* MAP / SATELLITE PILL TOGGLE */
.view-toggle{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  z-index:1000;display:flex;border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 2px 12px rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
}
.vt-btn{
  padding:7px 16px;font-size:12px;font-weight:600;
  font-family:Inter,sans-serif;cursor:pointer;border:none;
  background:rgba(10,15,13,0.88);color:rgba(255,255,255,0.55);
  transition:all 0.2s;white-space:nowrap;
}
.vt-btn:not(:last-child){border-right:1px solid rgba(255,255,255,0.12);}
.vt-btn.active{background:rgba(255,255,255,0.15);color:#fff;}
.vt-btn.labels-btn{color:#7dd3fc;}
.vt-btn.labels-btn.active{background:rgba(56,189,248,0.2);color:#38bdf8;}

/* SATELLITE TOGGLE BTN */
.sat-btn{
  border-color:#38bdf8!important;color:#38bdf8!important;
  margin-left:4px;flex-shrink:0;
}
.sat-btn.on{
  background:linear-gradient(135deg,#0ea5e9,#0284c7)!important;
  color:#fff!important;border-color:#0ea5e9!important;
}

/* MAP WRAPPER */
.map-wrapper{position:relative;}

/* ZOOM TO MINE */
#zoomMineBtn{
  position:absolute;top:10px;right:10px;z-index:1000;
  background:rgba(10,15,13,0.88);border:1px solid rgba(245,158,11,0.5);
  color:#fbbf24;font-size:11px;font-weight:600;
  padding:7px 12px;border-radius:10px;cursor:pointer;
  font-family:Inter,sans-serif;backdrop-filter:blur(10px);
  white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,0.4);
}
#zoomMineBtn:active{background:rgba(245,158,11,0.15);}

/* SATELLITE TERRAIN OVERLAY */
#terrainToggle{
  position:absolute;top:48px;right:10px;z-index:1000;
  background:rgba(10,15,13,0.88);border:1px solid rgba(56,189,248,0.4);
  color:#7dd3fc;font-size:11px;font-weight:600;
  padding:7px 12px;border-radius:10px;cursor:pointer;
  font-family:Inter,sans-serif;backdrop-filter:blur(10px);
  white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,0.4);
  display:none;
}
#terrainToggle.show{display:block;}
#terrainToggle.on{background:rgba(56,189,248,0.15);color:#38bdf8;}

/* SCIENCE LAYER BAR */
.science-bar{background:#080e0b;border-top:1px solid rgba(255,255,255,0.04);}
.science-label{
  font-size:9px;color:rgba(255,255,255,0.22);font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;
  align-self:center;padding:0 4px 0 2px;flex-shrink:0;
}
.layer-btn.topo{border-color:#65a30d;color:#84cc16;}
.layer-btn.topo.on{background:#84cc16;color:#000;}
.layer-btn.topo .dot{background:#84cc16;}
.layer-btn.geology{border-color:#b45309;color:#f59e0b;}
.layer-btn.geology.on{background:#f59e0b;color:#000;}
.layer-btn.geology .dot{background:#f59e0b;}
.layer-btn.ndvi{border-color:#15803d;color:#4ade80;}
.layer-btn.ndvi.on{background:#4ade80;color:#000;}
.layer-btn.ndvi .dot{background:#4ade80;}
.layer-btn.sentinel2{border-color:#0369a1;color:#38bdf8;}
.layer-btn.sentinel2.on{background:#38bdf8;color:#000;}
.layer-btn.sentinel2 .dot{background:#38bdf8;}
.layer-btn.landsat{border-color:#6d28d9;color:#a78bfa;}
.layer-btn.landsat.on{background:#a78bfa;color:#000;}
.layer-btn.landsat .dot{background:#a78bfa;}
.layer-btn.grace{border-color:#0e7490;color:#67e8f9;}
.layer-btn.grace.on{background:#67e8f9;color:#000;}
.layer-btn.grace .dot{background:#67e8f9;}
.layer-btn.sar{border-color:#be123c;color:#fb7185;}
.layer-btn.sar.on{background:#fb7185;color:#000;}
.layer-btn.sar .dot{background:#fb7185;}

/* SCIENCE LAYER ACTIVE BADGE */
#sciActiveBadge{
  display:none;padding:7px 14px;background:#0a0f0d;
  border-top:1px solid rgba(255,255,255,0.06);
  font-size:11px;color:rgba(255,255,255,0.45);text-align:center;
}
#sciActiveBadge.show{display:block;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <img src="logo.png" alt="Mzilikazi Kingdom">
  <h2>Mzilikazi Kingdom</h2>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <h1>&#x1F5FA;&#xFE0E; GIS Intelligence Portal</h1>
  <p>Geospatial mapping · Locate · Analyse · Manage</p>
  <div class="live-badge">Live OSM data · Sekhukhune District</div>
</div>

<!-- STATS ROW -->
<div class="stats-row">
  <div class="stat-box">
    <div class="val">2</div>
    <div class="lbl">Mining Zones</div>
  </div>
  <div class="stat-box">
    <div class="val">9 555</div>
    <div class="lbl">Total Hectares</div>
  </div>
  <div class="stat-box">
    <div class="val">9.14M</div>
    <div class="lbl">PGM Oz Resource</div>
  </div>
  <div class="stat-box">
    <div class="val">R2.8B</div>
    <div class="lbl">Infrastructure</div>
  </div>
</div>

<!-- LAYER CONTROLS -->
<div class="layer-bar">
  <button class="layer-btn mining on" onclick="toggleLayer('mining',this)">
    <span class="dot"></span> Mining
  </button>
  <button class="layer-btn agri on" onclick="toggleLayer('agri',this)">
    <span class="dot"></span> Agriculture
  </button>
  <button class="layer-btn land on" onclick="toggleLayer('land',this)">
    <span class="dot"></span> Land
  </button>
  <button class="layer-btn smart on" onclick="toggleLayer('smart',this)">
    <span class="dot"></span> Smart City
  </button>
  <button class="layer-btn on" id="fieldPinsBtn" onclick="toggleFieldPins()" style="border-color:#c9a84c;color:#c9a84c;background:rgba(201,168,76,0.1);">
    <span class="dot" style="background:#c9a84c;"></span> Field Pins
  </button>
</div>

<!-- SCIENCE / REMOTE SENSING LAYERS -->
<div class="layer-bar science-bar">
  <span class="science-label">Science</span>
  <button class="layer-btn geology" title="Rock types &amp; geological formations — Macrostrat" onclick="toggleSciLayer('geology',this)">
    <span class="dot"></span> Geology
  </button>
  <button class="layer-btn ndvi" title="Vegetation health index — NASA MODIS Terra" onclick="toggleSciLayer('ndvi',this)">
    <span class="dot"></span> NDVI
  </button>
  <button class="layer-btn sentinel2" title="ESA Sentinel-2 optical imagery — 10m resolution" onclick="toggleSciLayer('sentinel2',this)">
    <span class="dot"></span> Sentinel-2
  </button>
  <button class="layer-btn landsat" title="NASA Landsat 8/9 true colour — surface mineralogy" onclick="toggleSciLayer('landsat',this)">
    <span class="dot"></span> Landsat
  </button>
  <button class="layer-btn grace" title="NASA GRACE-FO groundwater drought indicator" onclick="toggleSciLayer('grace',this)">
    <span class="dot"></span> GRACE
  </button>
  <button class="layer-btn sar" title="ESA Sentinel-1 SAR — penetrates cloud &amp; dry soil" onclick="toggleSciLayer('sar',this)">
    <span class="dot"></span> SAR
  </button>
</div>

<!-- SCIENCE LAYER ACTIVE DESCRIPTION -->
<div id="sciActiveBadge"></div>
<div class="map-wrapper">
  <div id="map"></div>

  <!-- Google Maps style Map/Satellite toggle — bottom left of map -->
  <div class="view-toggle">
    <button id="btnMap" class="vt-btn active" onclick="setView('map')">Map</button>
    <button id="btnSat" class="vt-btn" onclick="setView('satellite')">Satellite</button>
    <button id="btnTopo" class="vt-btn" onclick="setView('topo')">Topo</button>
    <button id="btnLabels" class="vt-btn labels-btn" onclick="toggleLabels()" title="Place name labels">&#x1F4CD;&#xFE0E;</button>
  </div>

  <!-- Zoom to mine — top right -->
  <button id="zoomMineBtn" onclick="zoomToMine()">&#x26CF;&#xFE0E; Blue Ridge</button>

  <!-- Labels toggle — appears below zoom button when satellite is on -->
  <button id="terrainToggle" onclick="toggleTerrain(this)">&#x1F4CD;&#xFE0E; Labels</button>
</div>

<!-- INFO PANEL -->
<div class="info-panel" id="infoPanel">
  <div class="zone-tag" id="infoTag"></div>
  <h3 id="infoTitle"></h3>
  <p id="infoDesc"></p>
  <div class="meta" id="infoMeta"></div>
</div>

<!-- IDLE HINT -->
<div class="map-hint" id="mapHint">
  <p>&#x1F447;&#xFE0E; Tap any zone on the map for details</p>
</div>

<!-- QUICK LINKS BAR -->
<div style="padding:10px 14px;background:#0a0f0d;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;">
  <button onclick="location.href='field-collect.html'" style="flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid #c9a84c;background:rgba(201,168,76,0.1);color:#c9a84c;font-size:11px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;">&#x1F4CD;&#xFE0E; Field Form</button>
  <button onclick="location.href='compliance.html'" style="flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid #ef4444;background:rgba(239,68,68,0.1);color:#f87171;font-size:11px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;">&#x26A0;&#xFE0E; Compliance</button>
  <button onclick="location.href='data-room.html'" style="flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid #3b82f6;background:rgba(59,130,246,0.1);color:#60a5fa;font-size:11px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;">&#x1F512;&#xFE0E; Data Room</button>
  <button onclick="location.href='community.html'" style="flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid #22c55e;background:rgba(34,197,94,0.1);color:#4ade80;font-size:11px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;">&#x1F91D;&#xFE0E; Community</button>
  <button onclick="location.href='operations.html'" style="flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid #a855f7;background:rgba(168,85,247,0.1);color:#c084fc;font-size:11px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;">&#x1F4CA;&#xFE0E; Operations</button>
</div>

<!-- NAV -->
<div class="nav">
  <div onclick="location.href='index.html'">Home</div>
  <div onclick="location.href='compliance.html'">Comply</div>
  <div onclick="location.href='community.html'">Community</div>
  <div onclick="location.href='invest.html'">Invest</div>
  <div class="active">GIS</div>
</div>

<script>
/* ── MAP INIT ── */
const map = L.map('map',{
  center:[-25.1, 28.3],
  zoom:7,
  maxZoom:19,
  zoomControl:true,
  attributionControl:true
});

/* ── BASE TILE LAYERS ── */
const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap contributors &amp; CARTO',
  subdomains:'abcd', maxZoom:19
});
darkLayer.addTo(map);

// Esri World Imagery — real satellite, free, no API key
const satelliteLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA',
  maxZoom:19
});

// Esri Hybrid labels overlay — place names on top of satellite
const labelsLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Labels &copy; Esri',
  maxZoom:19, opacity:0.9
});

// OpenTopoMap — elevation contours, terrain features, free, no key
const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://opentopomap.org">OpenTopoMap</a> &copy; OpenStreetMap contributors',
  subdomains:'abc', maxZoom:17
});

/* ── SCIENCE / REMOTE SENSING OVERLAY LAYERS ──
   All sourced from NASA GIBS (free, no API key) and Macrostrat (free).
   Tiles load as overlays on top of whatever base layer is active.
   maxNativeZoom caps tile requests at the layer's real resolution;
   Leaflet stretches tiles beyond that rather than showing blank squares.
─────────────────────────────────────────────────────────────────────── */
const GIBS = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best';

const sciLayers = {

  // Macrostrat — geological rock types and age, global coverage
  geology: L.tileLayer('https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png',{
    attribution:'Geology &copy; <a href="https://macrostrat.org">Macrostrat</a>',
    maxNativeZoom:16, maxZoom:19, opacity:0.72
  }),

  // NASA MODIS Terra — 8-day NDVI composite, green=healthy vegetation
  ndvi: L.tileLayer(
    `${GIBS}/MODIS_Terra_NDVI_8Day/default/2024-09-01/GoogleMapsCompatible_Level7/{z}/{y}/{x}.jpg`,{
    attribution:'NDVI &copy; NASA GIBS / MODIS Terra',
    maxNativeZoom:7, maxZoom:19, opacity:0.82
  }),

  // ESA Sentinel-2 L2A — true colour optical, 10 m resolution
  sentinel2: L.tileLayer(
    `${GIBS}/Sentinel_2_L2A_TrueColor/default/2024-09-01/GoogleMapsCompatible_Level13/{z}/{y}/{x}.jpg`,{
    attribution:'Sentinel-2 &copy; NASA GIBS / ESA Copernicus',
    maxNativeZoom:13, maxZoom:19, opacity:0.9
  }),

  // NASA Landsat — annual true colour composite, useful for surface mineralogy
  landsat: L.tileLayer(
    `${GIBS}/Landsat_WELD_CorrectedReflectance_TrueColor_Global_Annual/default/2019-01-01/GoogleMapsCompatible_Level12/{z}/{y}/{x}.jpg`,{
    attribution:'Landsat &copy; NASA GIBS / USGS',
    maxNativeZoom:12, maxZoom:19, opacity:0.9
  }),

  // NASA GRACE-FO — groundwater drought indicator (blue=wet, red=dry)
  grace: L.tileLayer(
    `${GIBS}/GRACE_FO_Land_Groundwater_Drought_Indicator/default/2024-06-01/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png`,{
    attribution:'GRACE-FO &copy; NASA GIBS / JPL',
    maxNativeZoom:6, maxZoom:19, opacity:0.80
  }),

  // ESA Sentinel-1 SAR — VV polarisation, cloud-penetrating radar
  sar: L.tileLayer(
    `${GIBS}/Sentinel_1_SLC_VV/default/2024-06-01/GoogleMapsCompatible_Level13/{z}/{y}/{x}.jpg`,{
    attribution:'SAR &copy; NASA GIBS / ESA Copernicus Sentinel-1',
    maxNativeZoom:13, maxZoom:19, opacity:0.85
  })
};

const sciState = {geology:false, ndvi:false, sentinel2:false, landsat:false, grace:false, sar:false};

const sciDesc = {
  geology:   '&#x1F9F1; Geology — Rock types &amp; geological formations (Macrostrat). Bushveld Complex shows as layered igneous units.',

  btn.classList.toggle('on', sciState[type]);

let satOn      = false;
let labelsOn   = false;

function setView(mode){
  const btnMap  = document.getElementById('btnMap');
  const btnSat  = document.getElementById('btnSat');
  const btnTopo = document.getElementById('btnTopo');
  const terrain = document.getElementById('terrainToggle');

  // remove all base layers cleanly
  [darkLayer, satelliteLayer, topoLayer].forEach(l => { if(map.hasLayer(l)) map.removeLayer(l); });
  [btnMap, btnSat, btnTopo].forEach(b => b && b.classList.remove('active'));
  if(labelsOn){ map.removeLayer(labelsLayer); labelsOn = false; terrain.classList.remove('on'); }
  terrain.classList.remove('show');
  satOn = false;

  if(mode === 'satellite'){
    satOn = true;
    satelliteLayer.addTo(map);
    map.setView([-25.2441, 29.5583], 15);
    terrain.classList.add('show');
    btnSat.classList.add('active');
  } else if(mode === 'topo'){
    topoLayer.addTo(map);
    map.setView([-25.1, 29.0], 9);
    btnTopo.classList.add('active');
  } else {
    darkLayer.addTo(map);
    map.setView([-25.2441, 29.5583], 11);
    btnMap.classList.add('active');
  }
}

function toggleLabels(){
  const btn = document.getElementById('btnLabels');
  labelsOn = !labelsOn;
  btn.classList.toggle('active', labelsOn);
  if(labelsOn && satOn) labelsLayer.addTo(map);
  else map.removeLayer(labelsLayer);
}

function toggleSatellite(btn){
  satOn = !satOn;
  btn.classList.toggle('on', satOn);
  const terrain = document.getElementById('terrainToggle');

  if(satOn){
    map.removeLayer(darkLayer);
    satelliteLayer.addTo(map);
    // auto zoom into Blue Ridge for detail
    map.setView([-25.2441, 29.5583], 15);
    terrain.classList.add('show');
  } else {
    map.removeLayer(satelliteLayer);
    if(labelsOn){ map.removeLayer(labelsLayer); labelsOn=false; terrain.classList.remove('on'); }
    darkLayer.addTo(map);
    map.setView([-25.2441, 29.5583], 11);
    terrain.classList.remove('show');
  }
}

function toggleTerrain(btn){
  labelsOn = !labelsOn;
  btn.classList.toggle('on', labelsOn);
  if(labelsOn) labelsLayer.addTo(map);
  else         map.removeLayer(labelsLayer);
}

function zoomToMine(){
  map.setView([-25.2441, 29.5583], satOn ? 16 : 13);
}

/* ── OVERPASS CONFIG ── */
const OVERPASS = 'https://overpass-api.de/api/interpreter';
// Bounding box: Sekhukhune District + surrounds (south,west,north,east)
const BBOX = '-25.9,29.0,-24.2,30.4';

async function fetchOverpass(query){
  const ctrl = new AbortController();
  const timeout = setTimeout(()=> ctrl.abort(), 18000);
  try{
    const res = await fetch(OVERPASS,{
      method:'POST',
      body:'data=' + encodeURIComponent(query),
      signal: ctrl.signal
    });
    clearTimeout(timeout);
    return await res.json();
  }catch(e){
    clearTimeout(timeout);
    throw e;
  }
}

/* ── META & INFO PANEL ── */
function buildMeta(type, z){
  const parts = [];
  if(z.area)        parts.push(`<span>Location: <strong>${z.area}</strong></span>`);
  if(z.status)      parts.push(`<span>Status: <strong>${z.status}</strong></span>`);
  if(z.capital)     parts.push(`<span>Capital: <strong>${z.capital}</strong></span>`);
  if(z.commodities) parts.push(`<span>Commodities: <strong>${z.commodities}</strong></span>`);
  if(z.employment)  parts.push(`<span>Employment: <strong>${z.employment}</strong></span>`);
  if(z.hectares)    parts.push(`<span>Area: <strong>${z.hectares}</strong></span>`);
  if(z.size)        parts.push(`<span>Size: <strong>${z.size}</strong></span>`);
  if(z.nodes)       parts.push(`<span>Type: <strong>${z.nodes}</strong></span>`);
  if(z.source)      parts.push(`<span>Source: <strong>${z.source}</strong></span>`);
  return parts.join('');
}

function showInfo(type, z){
  const panel = document.getElementById('infoPanel');
  const hint  = document.getElementById('mapHint');
  const tc    = tagColors[type];
  document.getElementById('infoTag').innerHTML   = labels[type];
  document.getElementById('infoTag').style.cssText =
    `background:${tc.bg};border:1px solid ${tc.border};color:${tc.color};`;
  document.getElementById('infoTitle').textContent = z.name;
  document.getElementById('infoDesc').textContent  = z.notes;
  document.getElementById('infoMeta').innerHTML    = buildMeta(type, z);
  panel.classList.add('visible');
  hint.style.display = 'none';
}

/* ── HELPERS ── */
function setLoading(type, on){
  const btn = document.querySelector(`.layer-btn.${type}`);
  if(btn) btn.classList.toggle('loading', on);
}

function updateCount(type, count){
  const btn = document.querySelector(`.layer-btn.${type}`);
  if(!btn) return;
  let counter = btn.querySelector('.osm-count');
  if(!counter){ counter = document.createElement('span'); counter.className='osm-count'; btn.appendChild(counter); }
  counter.textContent = `(${count})`;
}

function addPoly(type, coords, z, dashed){
  const c = colors[type];
  const poly = L.polygon(coords,{
    color:c.stroke, fillColor:c.fill, fillOpacity:0.22, weight:1.5,
    dashArray: dashed ? '5,4' : null
  });
  poly.on('click', ()=> showInfo(type, z));
  poly.on('mouseover', function(){ this.setStyle({fillOpacity:0.42,weight:2.5}); });
  poly.on('mouseout',  function(){ this.setStyle({fillOpacity:0.22,weight:1.5}); });
  poly.bindTooltip(
    `<strong style="color:#fff">${z.name}</strong><br><small style="color:rgba(255,255,255,0.55)">${z.area||''}</small>`,
    {sticky:true}
  );
  if(activeState[type]) poly.addTo(map);
  layerGroups[type].push(poly);
}

function addNode(type, lat, lon, z){
  const c = colors[type];
  const circle = L.circleMarker([lat,lon],{
    radius:6, color:c.stroke, fillColor:c.fill,
    fillOpacity:0.85, weight:2
  });
  circle.on('click', ()=> showInfo(type, z));
  circle.bindTooltip(
    `<strong style="color:#fff">${z.name}</strong><br><small style="color:rgba(255,255,255,0.55)">${z.nodes||''}</small>`,
    {sticky:true}
  );
  if(activeState[type]) circle.addTo(map);
  layerGroups[type].push(circle);
}

function osmName(tags){
  return tags?.name || tags?.['name:en'] || tags?.['name:af'] || null;
}

/* ── LIVE: AGRICULTURE (OSM farmland) ── */
async function loadAgri(){
  setLoading('agri', true);
  const q = `[out:json][timeout:20];
way["landuse"~"^(farmland|farm|orchard|vineyard|meadow|plant_nursery|greenhouse_horticulture)$"](${BBOX});
out geom qt 60;`;
  try{
    const data = await fetchOverpass(q);
    const els  = data.elements || [];
    let count  = 0;
    els.forEach(el=>{
      if(el.type!=='way' || !el.geometry || el.geometry.length < 3) return;
      const coords = el.geometry.map(p=>[p.lat,p.lon]);
      const name   = osmName(el.tags) || 'Agricultural Land';
      const use    = el.tags?.landuse || 'farmland';
      const z = {
        name,
        area:'Sekhukhune District, Limpopo',
        status:'Active – OSM verified',
        notes:`Landuse: ${use}. OSM Way ID: ${el.id}. Data sourced live from OpenStreetMap.`,
        source:'OpenStreetMap Live'
      };
      addPoly('agri', coords, z, false);
      count++;
    });
    updateCount('agri', count);
    if(count===0) loadAgriFallback();
  }catch(e){
    loadAgriFallback();
  }finally{
    setLoading('agri', false);
  }
}

/* ── LIVE: SMART CITY (OSM infrastructure nodes) ── */
async function loadSmart(){
  setLoading('smart', true);
  const q = `[out:json][timeout:20];
(
  node["power"~"^(substation|plant|generator)$"](${BBOX});
  node["amenity"~"^(hospital|clinic|school|college|university|fire_station|police)$"](${BBOX});
  node["man_made"~"^(water_tower|water_works|wastewater_plant|pumping_station)$"](${BBOX});
  node["telecom"](${BBOX});
  node["tower:type"](${BBOX});
);
out qt 80;`;
  try{
    const data = await fetchOverpass(q);
    const els  = data.elements || [];
    let count  = 0;
    els.forEach(el=>{
      if(el.type!=='node' || !el.lat) return;
      const tags   = el.tags || {};
      const name   = osmName(tags) || inferName(tags, el.id);
      const infra  = tags.power || tags.amenity || tags.man_made || tags.telecom || tags['tower:type'] || 'infrastructure';
      const z = {
        name,
        area:'Sekhukhune District, Limpopo',
        status:'OSM verified',
        notes:`Infrastructure type: ${infra}. OSM Node ID: ${el.id}. Data sourced live from OpenStreetMap.`,
        nodes: capitalize(infra),
        source:'OpenStreetMap Live'
      };
      addNode('smart', el.lat, el.lon, z);
      count++;
    });
    updateCount('smart', count);
    if(count===0) loadSmartFallback();
  }catch(e){
    loadSmartFallback();
  }finally{
    setLoading('smart', false);
  }
}

function inferName(tags, id){
  if(tags.power==='substation') return `Eskom Substation #${id}`;
  if(tags.amenity==='hospital') return `Hospital`;
  if(tags.amenity==='school')   return `School`;
  if(tags.man_made==='water_tower') return `Water Tower`;
  return `Infrastructure Node`;
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

async function loadFieldReports(){
  try{
    const res  = await fetch(APPS_SCRIPT_URL + '?action=getFieldReports', {mode:'cors'});
    const data = await res.json();
    if(!data.reports || !data.reports.length) return plotDemoFieldPins();
    data.reports.forEach(r => plotFieldPin(r));
    updateFieldCount(data.reports.length);
  } catch(e){
    plotDemoFieldPins();
  }
}

function plotFieldPin(r){
  const lat = parseFloat(r.gpsLat);
  const lng = parseFloat(r.gpsLng);
  if(isNaN(lat) || isNaN(lng)) return;
  const color  = conditionColors[r.condition] || '#c9a84c';
  const icon   = L.divIcon({
    className:'',
    html:`<div style="
      width:12px;height:12px;border-radius:50%;
      background:${color};border:2px solid #fff;
      box-shadow:0 0 0 3px ${color}44;
    "></div>`,
    iconSize:[12,12],iconAnchor:[6,6]
  });
  const pin = L.marker([lat,lng],{icon});
  pin.bindTooltip(`
    <strong style="color:#fff">${r.siteName||'Field Report'}</strong><br>
    <small style="color:rgba(255,255,255,0.6)">${r.zoneType||''}</small><br>
    <small style="color:${color}">${r.condition||''} · ${r.fieldDate||''}</small>
  `,{sticky:true});
  pin.on('click',()=> showInfo('field',{
    name: r.siteName || 'Field Report',
    notes: r.fieldNotes || 'No notes recorded.',
    area: r.province || 'Unknown',
    status: r.condition || 'Unknown',
    source: `Officer: ${r.officerName||'—'} · Ref: ${r.ref||'—'}`,
    nodes: r.zoneType || '—'
  }));
  pin.addTo(map);
  fieldPins.push(pin);
}

    if(c) c.remove();
    c = document.createElement('span'); c.className='osm-count'; btn.appendChild(c);
    c.textContent = `(${count})`;
  }
}

function toggleFieldPins(){
  fieldVisible = !fieldVisible;
  const btn = document.getElementById('fieldPinsBtn');
  btn.classList.toggle('on', fieldVisible);
  fieldPins.forEach(p=>{ fieldVisible ? p.addTo(map) : map.removeLayer(p); });
}
